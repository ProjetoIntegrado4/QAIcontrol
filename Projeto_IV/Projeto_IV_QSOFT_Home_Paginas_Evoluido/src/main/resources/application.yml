spring:
  application:
    name: qsoft-ia-backend
  config:
    import: classpath:produtividade.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iadb}
    username: ${DB_USER:ia}
    password: ${DB_PASSWORD:ia}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

services:
  alert:
    base-url: ${ALERT_SERVICE_URL:http://localhost:3001}

app:
  auth:
    username: ${TEMP_LOGIN_USERNAME:admin@qsoft.com}
    password: ${TEMP_LOGIN_PASSWORD:Qsoft123!}
    name: ${TEMP_LOGIN_NAME:Administrador QSOFT}
  # Pontos de AI Literacy por capacitação registrada (US PP-19). Usados em service/PontuacaoAiLiteracy.
  # PRELIMINAR – validar com o PO: o documento do projeto ainda não define esses pesos (RF10/RF11).
  ai-literacy:
    pontos-curso: 10
    pontos-certificacao: 20

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
