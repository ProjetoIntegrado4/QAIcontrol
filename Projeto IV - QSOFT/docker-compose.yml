
services:
  postgres:
    image: postgres:16
    container_name: usuario-postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_DB: projeto_IV
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuario_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      app_net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: usuario-pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_net

  backend:
    build: .
    container_name: usuario-backend
    restart: always

    environment:
      DB_URL: jdbc:postgresql://db:5432/iadb
      DB_USER: ia
      DB_PASSWORD: ia
      ALERT_SERVICE_URL: http://alert-service:3001

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_net


volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_net:
    driver: bridge