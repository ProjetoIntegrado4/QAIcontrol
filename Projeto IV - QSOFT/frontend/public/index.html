<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Consumo de IA</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 32px auto; }
    input, button { padding: 8px; margin: 4px; }
    pre { background: #f5f5f5; padding: 12px; }
    #alerta { padding: 12px; margin-top: 12px; border: 1px solid #bbb; }
  </style>
</head>
<body>
  <h1>Cadastro de Empresas</h1>
  <p>Preencha abaixo as informações para por uma nova empresa no sistema.</p>

  <h2>Novo Empresa</h2>
  <input id="nome" placeholder="Nome">
  <input id="area" placeholder="Estado">
  <button onclick="criarProjeto()">Criar</button>

  <h2>Registrar consumo</h2>
  <input id="pid" placeholder="Project UUID">
  <input id="tokens" type="number" value="100">
  <input id="modelo" value="gpt-demo">
  <button onclick="consumir()">Registrar</button>
  <div id="alerta">Nenhum alerta avaliado.</div>

  <h2>Projetos</h2>
  <button onclick="listar()">Atualizar</button>
  <pre id="out"></pre>

<script>
const out = document.getElementById('out');
const alerta = document.getElementById('alerta');

async function criarProjeto() {
  const r = await fetch('/api/projects', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: nome.value, area: area.value})
  });
  out.textContent = await r.text();
}

async function consumir() {
  const r = await fetch('/api/usages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      projectId: pid.value,
      tokens: Number(tokens.value),
      model: modelo.value
    })
  });

  const body = await r.json();
  out.textContent = JSON.stringify(body, null, 2);

  if (body.alertLevel) {
    alerta.textContent = `${body.alertLevel}: ${body.alertMessage}`;
  }
}

async function listar() {
  const r = await fetch('/api/projects');
  out.textContent = JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
